[pytest]
testpaths = tests
addopts = -v --alluredir=reports/allure-results --clean-alluredir
markers =
    smoke: critical-path checks, run on every pull request
    regression: full functional suite, run on main and nightly
    api: pure REST API tests (no browser)
    ui: browser-only tests
    hybrid: UI action verified through the API, or API-seeded data verified in the UI
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
